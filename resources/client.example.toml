# pkgmirror download 客户端配置示例
# 拷贝为 client.toml 放在执行目录（自动探测），或用 --config 指定路径；文件不存在则忽略。

# PyPI 索引地址
# 优先级：--index-url 参数 > 本文件 > UV_INDEX_URL/PIP_INDEX_URL 环境变量 > pip.conf > 官方源
index-url = "https://pypi.org/simple"

# npm registry 地址（download npm 使用）
# 优先级：--registry 参数 > 本文件 > NPM_CONFIG_REGISTRY 环境变量 > 官方源
# registry = "https://registry.npmjs.org"

# Node.js dist 源根地址（download node 使用，官方布局的镜像源均可）
# 优先级：--dist-url 参数 > 本文件 > NODE_DIST_URL 环境变量 > 官方源
# node-dist-url = "https://cdn.npmmirror.com/binaries/node"

# Go 发行归档根地址（download golang 使用，flat 同布局的镜像源均可）
# 优先级：--dist-url 参数 > 本文件 > GOLANG_DIST_URL 环境变量 > 官方源
# golang-dist-url = "https://mirrors.aliyun.com/golang"

# 上游 Go module proxy 地址（download gomod 使用）
# 优先级：--goproxy 参数 > 本文件 > GOPROXY 环境变量（取首个 URL 段）> 官方源
# goproxy = "https://goproxy.cn"

# GitHub 反代前缀（uv 元数据与 CPython 安装包托管在 GitHub releases）
# 优先级：--github-prefix 参数 > 本文件 > GITHUB_PREFIX 环境变量 > 直连
# github-prefix = "https://ghproxy.net/"

# HTTP 代理地址
# 优先级：--proxy 参数 > 本文件 > HTTP_PROXY/HTTPS_PROXY 环境变量 > 直连
# proxy = "http://127.0.0.1:7890"
